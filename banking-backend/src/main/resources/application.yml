spring:
  application:
    name: lhb-core-banking-mock

server:
  # Loopback only: the backend must never be reachable from the network, only via the local gateway.
  address: 127.0.0.1
  port: 8080
  tomcat:
    basedir: .
    accesslog:
      # One line per request that actually reached the backend (used to prove throttled calls never arrive).
      enabled: true
      directory: logs
      prefix: access
      buffered: false
      pattern: '%t %a "%r" %s %b %{ms}T ms cid=%{X-Correlation-ID}o'
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Credential the WSO2 gateway presents (Publisher -> Endpoint Security -> Basic).
# Supplied from ~/.lhb-poc.env; the application refuses to start without it.
lhb:
  gateway:
    username: ${LHB_GW_USER:}
    password: ${LHB_GW_PASS:}
    jwt:
      # Public signing certificate of the WSO2 gateway (X-JWT-Assertion, RS256).
      certificate: classpath:wso2-gateway.pem

  # POC consent registry (fictional partners). Keys are WSO2 application UUIDs, i.e. the verified
  # http://wso2.org/claims/applicationUUId claim. They change only if the Developer Portal apps are recreated.
  consents:
    partners:
      f2e228cd-5c1e-4e16-a1a9-cd4d71a82447:
        name: PayLanka Wallet
        accounts: [ACC-1001, ACC-1002]
      8c6a3c36-8bd9-4a73-91b2-83484eeb5731:
        name: QuickBudget
        accounts: [ACC-2001]

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
