spring:
  application:
    name: lhb-core-banking-mock

server:
  # Loopback only: the backend must never be reachable from the network, only via the local gateway.
  address: 127.0.0.1
  port: 8080
  tomcat:
    basedir: .
    accesslog:
      # One line per request that actually reached the backend (used to prove throttled calls never arrive).
      enabled: true
      directory: logs
      prefix: access
      buffered: false
      pattern: '%t %a "%r" %s %b %{ms}T ms cid=%{X-Correlation-ID}o'
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Credential the WSO2 gateway presents (Publisher -> Endpoint Security -> Basic).
# Supplied from ~/.lhb-poc.env; the application refuses to start without it.
lhb:
  gateway:
    username: ${LHB_GW_USER:}
    password: ${LHB_GW_PASS:}

logging:
  pattern:
    level: "%5p [cid:%X{correlationId:-}]"
